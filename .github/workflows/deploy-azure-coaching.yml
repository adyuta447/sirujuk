name: deploy-azure-coaching

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      API_TOKEN: ${{ secrets.SIRUJUK_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$AZURE_CONTAINER_REGISTRY"
          docker build --tag "$AZURE_CONTAINER_REGISTRY.azurecr.io/backend:${GITHUB_SHA}" backend-go
          docker push "$AZURE_CONTAINER_REGISTRY.azurecr.io/backend:${GITHUB_SHA}"
          docker build --tag "$AZURE_CONTAINER_REGISTRY.azurecr.io/ml:${GITHUB_SHA}" ml-service
          docker push "$AZURE_CONTAINER_REGISTRY.azurecr.io/ml:${GITHUB_SHA}"

      - name: Create or update coaching services
        shell: bash
        env:
          STREAM_ENC_KEY: ${{ secrets.SIRUJUK_STREAM_ENC_KEY }}
          REDIS_PASSWORD: ${{ secrets.SIRUJUK_REDIS_PASSWORD }}
        run: |
          set -euo pipefail
          REGISTRY="$AZURE_CONTAINER_REGISTRY.azurecr.io"
          REGISTRY_USER=$(az acr credential show --name "$AZURE_CONTAINER_REGISTRY" --query username -o tsv)
          REGISTRY_PASSWORD=$(az acr credential show --name "$AZURE_CONTAINER_REGISTRY" --query passwords[0].value -o tsv)
          az containerapp env show --name sirujuk-azure-env --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1 ||
            az containerapp env create --name sirujuk-azure-env --resource-group "$AZURE_RESOURCE_GROUP" --location "$AZURE_LOCATION"

          if az containerapp show --name sirujuk-redis --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update --name sirujuk-redis --resource-group "$AZURE_RESOURCE_GROUP" \
              --image redis:7-alpine --set-env-vars "REDIS_PASSWORD=$REDIS_PASSWORD"
          else
            az containerapp create --name sirujuk-redis --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment sirujuk-azure-env --image redis:7-alpine \
              --ingress internal --target-port 6379 --transport tcp \
              --min-replicas 1 --max-replicas 1 \
              --env-vars "REDIS_PASSWORD=$REDIS_PASSWORD" \
              --command "sh" "-c" "exec redis-server --appendonly yes --requirepass \$REDIS_PASSWORD"
          fi

          if az containerapp show --name sirujuk-ml --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update --name sirujuk-ml --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$REGISTRY/ml:${GITHUB_SHA}" \
              --registry-server "$REGISTRY" --registry-username "$REGISTRY_USER" --registry-password "$REGISTRY_PASSWORD"
          else
            az containerapp create --name sirujuk-ml --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment sirujuk-azure-env --image "$REGISTRY/ml:${GITHUB_SHA}" \
              --registry-server "$REGISTRY" --registry-username "$REGISTRY_USER" --registry-password "$REGISTRY_PASSWORD" \
              --ingress internal --target-port 8000 --transport http --allow-insecure \
              --min-replicas 1 --max-replicas 1
          fi

          ML_FQDN=$(az containerapp show --name sirujuk-ml --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          REDIS_FQDN=$(az containerapp show --name sirujuk-redis --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)

          if az containerapp show --name sirujuk-backend --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp update --name sirujuk-backend --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$REGISTRY/backend:${GITHUB_SHA}" \
              --registry-server "$REGISTRY" --registry-username "$REGISTRY_USER" --registry-password "$REGISTRY_PASSWORD" \
              --set-env-vars "APP_ENV=development" "API_TOKEN=$API_TOKEN" "STREAM_ENC_KEY=$STREAM_ENC_KEY" \
                "ML_SERVICE_URL=http://$ML_FQDN" "REDIS_URL=redis://:$REDIS_PASSWORD@$REDIS_FQDN:6379/0" \
                "DEMO_ACCOUNTS=true" "SEED_COUNT=30" "CORS_ORIGIN=https://sirujuk.vercel.app"
          else
            az containerapp create --name sirujuk-backend --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment sirujuk-azure-env --image "$REGISTRY/backend:${GITHUB_SHA}" \
              --registry-server "$REGISTRY" --registry-username "$REGISTRY_USER" --registry-password "$REGISTRY_PASSWORD" \
              --ingress external --target-port 8080 --transport http --allow-insecure \
              --min-replicas 1 --max-replicas 1 \
              --env-vars "APP_ENV=development" "API_TOKEN=$API_TOKEN" "STREAM_ENC_KEY=$STREAM_ENC_KEY" \
                "ML_SERVICE_URL=http://$ML_FQDN" "REDIS_URL=redis://:$REDIS_PASSWORD@$REDIS_FQDN:6379/0" \
                "DEMO_ACCOUNTS=true" "SEED_COUNT=30" "CORS_ORIGIN=https://sirujuk.vercel.app"
          fi

          URL=$(az containerapp show --name sirujuk-backend --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --retry 0 "https://$URL/health"; then
              echo
              echo "Azure backend: https://$URL"
              exit 0
            fi
            sleep 10
          done
          az containerapp logs show --name sirujuk-backend --resource-group "$AZURE_RESOURCE_GROUP" --tail 100 || true
          exit 1
