name: ci-cd

# PRs: tests + security scans only (no cloud credentials).
# main: same checks, then GCP (ml-service -> backend) first, and only if healthy, the Vercel frontend.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel a deploy halfway

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: "1.26", check-latest: true, cache-dependency-path: backend-go/go.sum} # same major as backend-go/Dockerfile
      - working-directory: backend-go
        run: |
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: pip, cache-dependency-path: ml-service/requirements*.txt}
      - working-directory: ml-service
        run: |
          pip install -r requirements.txt -r requirements-train.txt httpx==0.28.1 pip-audit
          python train.py > /dev/null
          sha256sum models/sirujuk.joblib | cut -d" " -f1 > models/sirujuk.joblib.sha256
          python tests_smoke.py
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm test -- --ci
          npm run build
          npm audit --omit=dev --audit-level=high

  deploy-gcp:
    needs: [backend, ml, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions: {contents: read, id-token: write} # id-token: keyless auth to GCP, no JSON key anywhere
    outputs:
      backend_url: ${{ steps.backend_url.outputs.url }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sirujuk
      ML_MIN_INSTANCES: ${{ vars.ML_MIN_INSTANCES || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ml-service first: the backend needs its URL.
      - id: ml_img
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ml-service
          push: true
          tags: ${{ env.REGISTRY }}/ml-service:${{ github.sha }}
          cache-from: type=gha,scope=ml
          cache-to: type=gha,scope=ml,mode=max
      - id: ml_url
        env:
          IMAGE: ${{ env.REGISTRY }}/ml-service@${{ steps.ml_img.outputs.digest }}
        run: |
          envsubst '$IMAGE $PROJECT $ML_MIN_INSTANCES' < infra/gcp/cloudrun-ml.yaml > "$RUNNER_TEMP/ml.yaml"
          gcloud run services replace "$RUNNER_TEMP/ml.yaml" --region "$REGION"
          echo "url=$(gcloud run services describe sirujuk-ml --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - id: be_img
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend-go
          push: true
          tags: ${{ env.REGISTRY }}/backend-go:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - id: backend_url
        env:
          IMAGE: ${{ env.REGISTRY }}/backend-go@${{ steps.be_img.outputs.digest }}
          ML_URL: ${{ steps.ml_url.outputs.url }}
        run: |
          envsubst '$IMAGE $PROJECT $ML_URL' < infra/gcp/cloudrun-go.yaml > "$RUNNER_TEMP/be.yaml"
          gcloud run services replace "$RUNNER_TEMP/be.yaml" --region "$REGION"
          url=$(gcloud run services describe sirujuk-backend --region "$REGION" --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused "$url/health" # /healthz is reserved by Cloud Run and 404s; gate: no healthy backend, no frontend deploy

  deploy-frontend:
    needs: deploy-gcp
    runs-on: ubuntu-latest
    environment: production
    defaults: {run: {working-directory: frontend}}
    env: # run `vercel link` inside frontend/ once; leave the project's Root Directory empty and do NOT connect Git in Vercel
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI: vercel@63.1.0 # not named VERCEL: that variable means "running on Vercel" to build tools
      BACKEND_URL: ${{ needs.deploy-gcp.outputs.backend_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=production
          npx --yes "$VERCEL_CLI" build --prod
          npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --env BACKEND_URL="$BACKEND_URL"
