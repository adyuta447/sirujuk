services:
  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    environment:
      GO_PORT: 8080
      ML_ENABLED: "false"
      SEED_COUNT: "50"
    ports:
      - "8080:8080"
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend-go
