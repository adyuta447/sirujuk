# Rendered by .github/workflows/deploy.yml (envsubst) and applied with `gcloud run services replace`.
# Public URL (Vercel is outside GCP) but every /api call needs the API_TOKEN bearer; instances are capped.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sirujuk-backend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        # Cloud Run balances requests across instances. Safe since MemoryStore writes are versioned (a stale write is
        # retried, never overwrites) and Sync brings other instances' changes in every STORE_SYNC_SECONDS (default 30 s).
        # Also caps the bill.
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/startup-cpu-boost: "true"
        # Direct VPC egress (no connector VM to pay for): reaches the private Redis VM from infra/gcp/redis-vm.sh.
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
    spec:
      serviceAccountName: sirujuk-backend@${PROJECT}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 15
      containers:
        - image: ${IMAGE}
          ports: [{containerPort: 8080}]
          resources: {limits: {cpu: "1", memory: 256Mi}}
          env:
            - {name: APP_ENV, value: production}
            - {name: ALLOW_CLIENT_CONTEXT, value: "false"}
            - {name: ML_SERVICE_URL, value: "${ML_URL}"}
            - {name: ML_AUTH, value: cloudrun}
            - {name: FIRESTORE_PROJECT, value: "${PROJECT}"} # login accounts; the backend account holds roles/datastore.user
            - name: API_TOKEN
              valueFrom: {secretKeyRef: {name: sirujuk-api-token, key: latest}}
            - name: STREAM_ENC_KEY # encrypts queued referrals (patient data) in Redis; the backend refuses to start without it
              valueFrom: {secretKeyRef: {name: sirujuk-stream-key, key: latest}}
            - name: DATA_ENC_KEY # encrypts referrals in Firestore; created by infra/gcp/setup.sh, required in production
              valueFrom: {secretKeyRef: {name: sirujuk-data-key, key: latest}}
            - name: REDIS_URL # rediss:// (TLS); the backend refuses plaintext Redis in production
              valueFrom: {secretKeyRef: {name: sirujuk-redis-url, key: latest}}
            - name: REDIS_CA_CERT # the Redis VM's self-signed certificate, the only one trusted (infra/gcp/redis-vm.sh)
              valueFrom: {secretKeyRef: {name: sirujuk-redis-ca, key: latest}}
