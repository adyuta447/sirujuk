# Rendered by .github/workflows/deploy.yml (envsubst) and applied with `gcloud run services replace`.
# Public URL (Vercel is outside GCP) but every /api call needs the API_TOKEN bearer; instances are capped.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sirujuk-backend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        # One instance on purpose. Referral state (scores, audits, clarifications) is cached in memory per instance, so
        # with more than one an audit saved on A is invisible on B and a later write on B can overwrite it. Raise this
        # (it also caps the bill under abuse) only after the versioned writes and periodic Sync in MemoryStore are
        # merged, deployed and re-tested with two instances. See docs/security.md, finding S12.
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: sirujuk-backend@${PROJECT}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 15
      containers:
        - image: ${IMAGE}
          ports: [{containerPort: 8080}]
          resources: {limits: {cpu: "1", memory: 256Mi}}
          env:
            - {name: APP_ENV, value: production}
            - {name: ALLOW_CLIENT_CONTEXT, value: "false"}
            - {name: ML_SERVICE_URL, value: "${ML_URL}"}
            - {name: ML_AUTH, value: cloudrun}
            - {name: FIRESTORE_PROJECT, value: "${PROJECT}"} # login accounts; the backend account holds roles/datastore.user
            - name: API_TOKEN
              valueFrom: {secretKeyRef: {name: sirujuk-api-token, key: latest}}
            - name: STREAM_ENC_KEY # encrypts queued referrals (patient data) in Redis; the backend refuses to start without it
              valueFrom: {secretKeyRef: {name: sirujuk-stream-key, key: latest}}
            # Turn on field encryption of patient data in Firestore: run infra/gcp/setup.sh once (it creates the
            # sirujuk-data-key secret and grants access), then uncomment these two lines and deploy. Without the
            # secret in place, a deploy that references it fails, so this stays commented until then.
            # - name: DATA_ENC_KEY
            #   valueFrom: {secretKeyRef: {name: sirujuk-data-key, key: latest}}
            - name: REDIS_URL
              valueFrom: {secretKeyRef: {name: sirujuk-redis-url, key: latest}}
