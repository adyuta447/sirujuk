# Rendered by .github/workflows/deploy.yml (envsubst) and applied with `gcloud run services replace`.
# Public URL (Vercel is outside GCP) but every /api call needs the API_TOKEN bearer; instances are capped.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sirujuk-backend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3" # caps the bill under abuse
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: sirujuk-backend@${PROJECT}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 15
      containers:
        - image: ${IMAGE}
          ports: [{containerPort: 8080}]
          resources: {limits: {cpu: "1", memory: 256Mi}}
          env:
            - {name: APP_ENV, value: production}
            - {name: ALLOW_CLIENT_CONTEXT, value: "false"}
            - {name: ML_SERVICE_URL, value: "${ML_URL}"}
            - {name: ML_AUTH, value: cloudrun}
            - {name: FIRESTORE_PROJECT, value: "${PROJECT}"} # login accounts; the backend account holds roles/datastore.user
            - name: API_TOKEN
              valueFrom: {secretKeyRef: {name: sirujuk-api-token, key: latest}}
            - name: REDIS_URL
              valueFrom: {secretKeyRef: {name: sirujuk-redis-url, key: latest}}
